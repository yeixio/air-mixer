version: '3.8'

services:
  airmixer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airmixer
    restart: unless-stopped
    network_mode: host  # Required for mDNS/Bonjour to work properly
    volumes:
      - ./data:/app/data
    ports:
      - "9001:9001"  # Web UI
      - "49152:49152"  # AirPlay (default)
    environment:
      - AIRMIXER_DATA_DIR=/app/data
    # Uncomment if you need additional capabilities
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9001/api/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

