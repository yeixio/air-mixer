services:
  airmixer:
    build: .
    image: airmixer:local
    container_name: airmixer
    restart: unless-stopped
    # Host networking is required: AirPlay discovery uses multicast DNS and
    # audio streams use dynamic UDP ports.
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      AIRMIXER_LOGGING_LEVEL: info
