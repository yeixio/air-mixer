version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Best-effort writes and closes where there is nothing useful to do
        # with the error.
        - (net.Conn).Close
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (*net.UDPConn).Close
        - (*net.UDPConn).WriteToUDP
        - (net.Listener).Close
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write
        - crypto/rand.Read
        - (*database/sql.Tx).Rollback
    revive:
      rules:
        - name: exported
          disabled: true # internal packages; doc comments are reviewed by hand
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gocritic]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yeixio/air-mixer
