name: Image

# Publishes multi-arch container images to the GitHub Container Registry:
# "edge" and "sha-<short commit>" from master, and a version tag plus
# "latest" for each v* tag. After a master image is published, the edge
# branch moves to that commit, so clusters that follow it (an Argo CD app on
# targetRevision edge with image.tag sha-$ARGOCD_APP_REVISION_SHORT) roll out
# each new build by themselves, and only builds they can pull.
on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=master
            type=sha,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}

  edge:
    if: github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Fast-forward only, so a slow run for an older commit never moves edge
      # back.
      - name: Move edge to this commit
        run: |
          if git rev-parse -q --verify origin/edge > /dev/null &&
            ! git merge-base --is-ancestor origin/edge "$GITHUB_SHA"; then
            echo "edge is already past ${GITHUB_SHA}."
            exit 0
          fi
          git push origin "${GITHUB_SHA}:refs/heads/edge"
