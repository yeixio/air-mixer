{{- $p := .Values.controller.persistence }}
{{- if and .Values.controller.enabled $p.enabled (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "airmixer.fullname" . }}-controller
  labels:
    {{- include "airmixer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  annotations:
    # Keep the database when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  {{- with $p.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
