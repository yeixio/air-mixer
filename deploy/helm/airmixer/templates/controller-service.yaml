{{- if and .Values.controller.enabled .Values.controller.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "airmixer.fullname" . }}
  labels:
    {{- include "airmixer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: {{ .Values.controller.service.type }}
  selector:
    {{- include "airmixer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: {{ .Values.controller.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
